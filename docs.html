<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading… · SAP EA Certification Workspace</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#12151c">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%232454c9'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EEA%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { overflow: auto; background: var(--canvas-bg); height: auto; min-height: 100%; }
        .doc-topbar {
            position: sticky;
            top: 0;
            background: var(--shell-panel);
            color: var(--shell-text);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 20px;
            z-index: 10;
            border-bottom: 1px solid var(--shell-border);
        }
        .doc-topbar a { color: var(--shell-text); text-decoration: none; font-size: 13px; white-space: nowrap; }
        .doc-topbar a:hover { color: var(--accent-on-dark); }
        .doc-topbar__title {
            color: var(--shell-text-strong);
            font-weight: 600;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .doc-topbar__spacer { flex: 1; }
        .doc-page { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
        .doc-error { padding: 60px 24px; text-align: center; color: var(--text-muted); }
        @media (max-width: 640px) {
            .doc-page { padding: 24px 16px 60px; }
        }
    </style>
</head>
<body>
    <header class="doc-topbar">
        <a href="index.html">← Back to Workspace</a>
        <span class="doc-topbar__title" id="docTitle">Loading…</span>
        <span class="doc-topbar__spacer"></span>
        <a id="docRawLink" href="#" target="_blank" rel="noopener">View raw</a>
    </header>
    <main class="doc-page">
        <div class="sheet-inner" id="docContent">
            <p>Loading…</p>
        </div>
    </main>
    <script src="docs.js"></script>
</body>
</html>
