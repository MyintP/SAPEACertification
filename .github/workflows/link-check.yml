name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude-mail
            --exclude "https://myintp.github.io/*"
            --exclude "https://learning.sap.com/*"
            --exclude "https://community.sap.com/*"
            --exclude "https://groups.community.sap.com/*"
            --accept 200,206,403,429
            --max-retries 2
            index.html
            quiz.html
            *.md
            docs
            domains
            quiz
            resources
            artifacts
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
