name: Link Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check internal repository links
        run: |
          test -f index.html
          test -f README.md

          grep -q 'https://ordoanimi.com' README.md
          grep -q 'https://framework.ordoanimi.com' README.md

      - name: Smoke-test GitHub Pages
        run: |
          curl --fail --silent --show-error --location \
            https://myintp.github.io/SAPEACertification/
